{# Centered section heading with ornament and hairlines. Params: title, subtitle, view_all (URL) - all optional. #}
{% load i18n %}
<header class="hm-head">
  <div class="hm-head__heading">
    <svg class="hm-head__lotus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 4c2 2.2 3 4.4 3 6.8 0 2.4-1.2 4.4-3 5.7-1.8-1.3-3-3.3-3-5.7C9 8.4 10 6.2 12 4z"/><path d="M9 11.5C7.6 10.6 5.4 10.4 3.5 11c.2 3.4 2.6 6 6.5 6.6M15 11.5c1.4-.9 3.6-1.1 5.5-.5-.2 3.4-2.6 6-6.5 6.6"/><path d="M12 17v3.5"/></svg>
    {% if title %}<h2 class="hm-head__title"><span>{{ title }}</span></h2>{% endif %}
    {% if subtitle %}<p class="hm-head__subtitle">{{ subtitle }}</p>{% endif %}
  </div>
  {% if view_all %}<a href="{{ view_all }}" class="hm-head__all">{% trans "View all" %} <span aria-hidden="true">&rarr;</span></a>{% endif %}
</header>
