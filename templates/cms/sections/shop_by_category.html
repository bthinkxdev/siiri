{% load i18n static %}
{% if section_context.categories %}
<section class="hm-circles" id="jm-categories" aria-label="{% trans 'Shop by category' %}">
  <div class="hm-wrap">
    <ul class="hm-circles__row" role="list">
      {% for category in section_context.categories %}
      <li class="hm-circles__slot">
        <a href="{% url 'catalog:plp-category' category_slug=category.slug %}" class="hm-circle">
          <span class="hm-circle__photo">
            <img src="{% if category.og_image %}{{ category.og_image.url }}{% else %}{% static 'img/product-placeholder.svg' %}{% endif %}"
                 alt="" width="120" height="120" loading="lazy" decoding="async">
          </span>
          <span class="hm-circle__label">{{ category.name }}</span>
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>
</section>
{% endif %}
