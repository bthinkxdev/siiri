{% load i18n %}
<form class="plp-filters card p-3" method="get" action="{{ request.path }}" hx-get="{{ request.path }}"
  hx-target="#product-grid" hx-swap="innerHTML" hx-push-url="true" hx-indicator="#product-grid"
  hx-trigger="submit">
  <h2 class="h6 plp-filters-header">{% trans "Filters" %}</h2>
  <div class="plp-filters-body">
    {% if not active_collection %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Collection" %}</label>
      <select name="collection" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for collection in collections %}
        <option value="{{ collection.pk }}" {% if filters.collection_id == collection.pk %}selected{% endif %}>{{ collection.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% else %}
    <input type="hidden" name="collection" value="{{ active_collection.pk }}">
    {% endif %}

    {% if styles %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Style" %}</label>
      <select name="style" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for style in styles %}
        <option value="{{ style.pk }}" {% if filters.style_id == style.pk %}selected{% endif %}>{{ style.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    {% if fabrics %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Fabric" %}</label>
      <select name="fabric" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for fabric in fabrics %}
        <option value="{{ fabric.pk }}" {% if filters.fabric_id == fabric.pk %}selected{% endif %}>{{ fabric.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    {% if occasions %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Occasion" %}</label>
      <select name="occasion" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for occasion in occasions %}
        <option value="{{ occasion.pk }}" {% if filters.occasion_id == occasion.pk %}selected{% endif %}>{{ occasion.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    {% if grades %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Grade" %}</label>
      <select name="grade" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for grade in grades %}
        <option value="{{ grade.pk }}" {% if filters.grade_id == grade.pk %}selected{% endif %}>{{ grade.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}

    {% if site_settings.brands_enabled %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Brand" %}</label>
      <select name="brand" class="form-select form-select-sm">
        <option value="">{% trans "All" %}</option>
        {% for brand in brands %}
        <option value="{{ brand.pk }}" {% if filters.brand_id == brand.pk %}selected{% endif %}>{{ brand.name }}</option>
        {% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="mb-3">
      <label class="form-label small">{% trans "Price" %}</label>
      <div class="input-group input-group-sm">
        <input type="number" name="min_price" class="form-control" placeholder="Min" value="{{ request.GET.min_price }}">
        <input type="number" name="max_price" class="form-control" placeholder="Max" value="{{ request.GET.max_price }}">
      </div>
    </div>
    <div class="form-check mb-1 ms-1"><input class="form-check-input" type="checkbox" name="featured" value="1" id="f-ft" {% if filters.featured %}checked{% endif %}><label class="form-check-label small" for="f-ft">{{ site_settings.featured_label }}</label></div>
    <div class="form-check mb-1 ms-1"><input class="form-check-input" type="checkbox" name="bestseller" value="1" id="f-bs" {% if filters.bestseller %}checked{% endif %}><label class="form-check-label small" for="f-bs">{{ site_settings.bestseller_label }}</label></div>
    <div class="form-check mb-1 ms-1"><input class="form-check-input" type="checkbox" name="new_arrival" value="1" id="f-new" {% if filters.new_arrival %}checked{% endif %}><label class="form-check-label small" for="f-new">{{ site_settings.new_arrival_label }}</label></div>
    <div class="form-check mb-3 ms-1"><input class="form-check-input" type="checkbox" name="in_stock" value="1" id="f-stock" {% if filters.in_stock %}checked{% endif %}><label class="form-check-label small" for="f-stock">{% trans "In Stock" %}</label></div>
    <div class="mb-2">
      <label class="form-label small">{% trans "Sort" %}</label>
      <select name="sort" class="form-select form-select-sm">
        <option value="" {% if not sort %}selected{% endif %}>{% trans "Recommended" %}</option>
        <option value="newest" {% if sort == 'newest' %}selected{% endif %}>{% trans "Newest" %}</option>
        <option value="price_asc" {% if sort == 'price_asc' %}selected{% endif %}>{% trans "Price: Low to High" %}</option>
        <option value="price_desc" {% if sort == 'price_desc' %}selected{% endif %}>{% trans "Price: High to Low" %}
        </option>
        <option value="rating" {% if sort == 'rating' %}selected{% endif %}>{% trans "Top Rated" %}</option>
      </select>
    </div>
  </div>
  <div class="d-flex gap-2 plp-filters-footer pt-2">
    <button type="submit" class="btn btn-floward btn-sm flex-grow-1" data-bs-dismiss="offcanvas">{% trans "Apply" %}</button>
    <a href="{{ request.path }}" class="btn btn-outline-secondary btn-sm flex-grow-1 text-center d-inline-flex align-items-center justify-content-center">{% trans "Clear" %}</a>
  </div>
</form>
